name: Gestao Umbanda - publicar no servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestao-umbanda-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da versao exata
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar configuracao SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_SSH_HOST || secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_KEY SSH_HOST SSH_USER SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Configuracao ausente: $name"
              exit 1
            fi
          done
          if ! [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST deve conter somente IP ou dominio"
            exit 1
          fi
          if ! [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::DEPLOY_USER deve conter somente o usuario SSH"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY nao e uma chave privada valida"
            exit 1
          fi
          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS nao contem o host configurado"
            exit 1
          fi
      - name: Publicar pelo implantador seguro do servidor
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_SSH_HOST || secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/gestao-umbanda-deploy '${GITHUB_SHA}'"
