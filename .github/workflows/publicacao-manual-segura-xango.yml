name: Publicacao manual segura Gestao Umbanda Xango

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gestao-umbanda-pages-manual
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Verificar arquivo principal
        run: test -s index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pacote github-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
