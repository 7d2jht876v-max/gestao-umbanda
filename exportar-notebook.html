<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transferir dados para o notebook</title><style>body{max-width:700px;margin:40px auto;padding:20px;background:#f8f4ef;color:#432d21;font:18px/1.6 system-ui}button{padding:16px;background:#75492f;color:white;border:0;border-radius:10px;font-size:18px}#status{white-space:pre-wrap}</style><h1>Transferir dados para o notebook</h1><p>Abra esta página no mesmo navegador e perfil em que utiliza o Gestão Umbanda. A exportação lê somente os dados deste aparelho e não precisa do Supabase.</p><p>O arquivo contém informações pessoais do templo. Guarde-o com cuidado e importe apenas no seu servidor.</p><button id="export">Baixar dados deste aparelho</button><p id="status" role="status"></p><script>
const status=document.getElementById('status');document.getElementById('export').onclick=async()=>{try{const storage={};const allowed=k=>/^gestao[-_]/i.test(k)&&!/(device-sync|before-device|upload-delta|auto-sync-pending|sync-retry|supabase-revisions|supabase-pending)/i.test(k);for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(allowed(key))storage[key]=localStorage.getItem(key);}
await new Promise((resolve,reject)=>{const r=indexedDB.open('gestao-umbanda-storage-v1');r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('values')){db.close();resolve();return;}const tx=db.transaction('values','readonly');const request=tx.objectStore('values').openCursor();request.onsuccess=()=>{const cursor=request.result;if(cursor){if(allowed(String(cursor.key)))storage[cursor.key]=cursor.value;cursor.continue();}};tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};};r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Feche outras abas do aplicativo e tente novamente.'));});
const data=JSON.parse(storage['gestao-umbanda-v1']||'{}');const count=Object.values(data).filter(Array.isArray).reduce((sum,rows)=>sum+rows.length,0);if(!count&&!storage['gestao-umbanda-radiestesia-fichas-v1'])throw Error('Nenhum cadastro encontrado neste navegador. Abra no navegador e perfil usados para os cadastros.');const backup={format:'gestao-transferencia-notebook',version:1,exportedAt:new Date().toISOString(),storage};const url=URL.createObjectURL(new Blob([JSON.stringify(backup)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='transferencia-gestao-notebook-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='Arquivo preparado: '+count+' registros principais encontrados. Nenhum dado foi apagado ou enviado. Importe o arquivo no servidor do notebook.';}catch(e){status.textContent='Não foi possível exportar: '+e.message;}};
</script></html>
